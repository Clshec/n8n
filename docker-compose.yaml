# =============================================================================
# n8n + PostgreSQL - Coolify Deployment (Hardened)
# =============================================================================
# REQUIRED Variables (must be set in Coolify > Environment Variables):
#
#   POSTGRES_PASSWORD     → Strong password for the database (REQUIRED!)
#   N8N_ENCRYPTION_KEY    → Random 32+ char string to encrypt credentials (REQUIRED!)
#   N8N_HOST              → Your domain without https (e.g. n8n.yourdomain.com) (REQUIRED!)
#
# OPTIONAL Variables:
#   POSTGRES_USER         → Defaults to "n8n"
#   POSTGRES_DB           → Defaults to "n8n"
#   N8N_PROTOCOL          → Defaults to "https"
#   GENERIC_TIMEZONE      → Defaults to "Asia/Riyadh"
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  n8n_db:
    image: postgres:16-alpine
    restart: always
    command: >
      postgres
      -c password_encryption=scram-sha-256
      -c log_statement=ddl
      -c log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    # ============================================
    # Container isolation hardening
    # ============================================
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
      - NET_BIND_SERVICE
    # ============================================
    # Resource limits
    # ============================================
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # ============================================
    # DNS security
    # ============================================
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # ============================================
    # Log rotation
    # ============================================
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n} -d $${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - default

  # ---------------------------------------------------------------------------
  # n8n - Workflow Automation
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:1.91.3
    restart: always
    depends_on:
      n8n_db:
        condition: service_healthy
    environment:
      # --- Database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n_db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}

      # --- n8n Core ---
      N8N_HOST: ${N8N_HOST:?N8N_HOST is required}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${N8N_PROTOCOL:-https}://${N8N_HOST}/

      # --- Security ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}

      # --- Timezone ---
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Riyadh}
      TZ: ${GENERIC_TIMEZONE:-Asia/Riyadh}

      # --- Database Maintenance ---
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none

      # --- Performance ---
      NODE_OPTIONS: "--max-old-space-size=2048"

      # --- Fix Warnings ---
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"

    expose:
      - "5678"
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=256M
    volumes:
      - n8n_data:/home/node/.n8n
    # ============================================
    # Container isolation hardening
    # ============================================
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # ============================================
    # Resource limits
    # ============================================
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
    # ============================================
    # DNS security
    # ============================================
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # ============================================
    # Log rotation
    # ============================================
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # HTTP → HTTPS permanent redirect
      - "traefik.http.routers.n8n-http.rule=Host(`n8n.gumacu.com`)"
      - "traefik.http.routers.n8n-http.entrypoints=http"
      - "traefik.http.routers.n8n-http.middlewares=rate-limit-n8n,redirect-to-https-n8n"
      # HTTPS with TLS
      - "traefik.http.routers.n8n-https.rule=Host(`n8n.gumacu.com`)"
      - "traefik.http.routers.n8n-https.entrypoints=https"
      - "traefik.http.routers.n8n-https.tls=true"
      - "traefik.http.routers.n8n-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n-https.middlewares=rate-limit-n8n,hsts-header-n8n,security-headers-n8n"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      # HSTS: force HTTPS for 1 year
      - "traefik.http.middlewares.hsts-header-n8n.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.hsts-header-n8n.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.hsts-header-n8n.headers.stsPreload=true"
      - "traefik.http.middlewares.hsts-header-n8n.headers.forceSTSHeader=true"
      # Redirect middleware
      - "traefik.http.middlewares.redirect-to-https-n8n.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https-n8n.redirectscheme.permanent=true"
      # Rate limiting: 30 req/s average, 60 burst per client IP
      - "traefik.http.middlewares.rate-limit-n8n.ratelimit.average=30"
      - "traefik.http.middlewares.rate-limit-n8n.ratelimit.period=1s"
      - "traefik.http.middlewares.rate-limit-n8n.ratelimit.burst=60"
      # Security headers
      - "traefik.http.middlewares.security-headers-n8n.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers-n8n.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers-n8n.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers-n8n.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.security-headers-n8n.headers.customFrameOptionsValue=SAMEORIGIN"

# =============================================================================
# Volumes (Persistent Storage)
# =============================================================================
volumes:
  n8n_db_data:
  n8n_data:

# =============================================================================
# Networks
# =============================================================================
networks:
  default: {}
  coolify:
    external: true
